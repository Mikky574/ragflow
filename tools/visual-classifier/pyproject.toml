[project]
name = "ragflow-visual-classifier"
version = "0.1.0"
description = "Standalone visual-region classifier for RAGFlow PDF and presentation ingestion."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "torch>=2.4.0",
  "transformers>=4.50.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
