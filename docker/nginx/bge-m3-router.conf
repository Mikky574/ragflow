upstream bge_m3_pool {
    least_conn;
    server bge-m3-gpu0:80 max_fails=3 fail_timeout=10s;
    server bge-m3-gpu1:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    client_max_body_size 16m;

    location / {
        proxy_pass http://bge_m3_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
